<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="Assets/PowHouseLogo.png">
    <link rel="stylesheet" href="styles.css">
    <script src="try.js" defer></script>
</head>
<body class="try-page">
    <nav class="navbar">
        <a href="index.html" aria-label="Pow House home">
            <img class="logo" src="Assets/PowHouseLogo.png" alt="Pow House Logo" width="100" height="100">
        </a>
        <ul class="nav-links">
            <li><a href="try.html" class="try-btn">Try</a></li>
        </ul>
    </nav>
    <div class="fiddle">
        <div class="slider-controls">
            <div class="slider-container">
                <label for="font-size">Font Size</label>
                <input type="range" id="font-size" min="10" max="100" value="64">
                <span class="value font">64 px</span>
            </div>
            <div class="slider-container">
                <label for="leading-size">Leading</label>
                <input type="range" id="leading-size" min="10" max="120" value="61">
                <span class="value leading">61 px</span>
            </div>
            <div class="slider-container">
                <label for="kerning-size">Kerning</label>
                <input type="range" id="kerning-size" min="0" max="20" value="0">
                <span class="value kerning">0 px</span>
                <label class="font-select-label" for="font-family">Typeface</label>
                <select class="font-select" id="font-family">
                    <option value="400">Pow 1</option>
                    <option value="700">Pow 2</option>
                </select>
            </div>
        </div>
        <p class="adjust" contenteditable="true" role="textbox" aria-label="Editable typography preview">The building blocks of typography are buildings themselves</p>
    </div>
    <a class="download" href="Assets/PowHouse.zip" download="PowHouse.zip">Download</a>
    <footer class="footer">
        <p class="footer-text">© 2024 Pallavi Mallik. All rights reserved.</p>
        <div class="footer-logos">
            <a href="https://www.instagram.com/pallavis.art/" aria-label="Pallavi's Art on Instagram" target="_blank" rel="noopener noreferrer">
                <img class="insta" src="Assets/Instagram_Glyph_White.png" alt="Instagram Logo" width="30" height="30" loading="lazy" decoding="async">
            </a>
            <a href="mailto:pallavimallik2007@gmail.com" aria-label="Pallavi's Email" target="_blank" rel="noopener noreferrer">
                <img class="email" src="Assets/Email.png" alt="Email Logo" width="25" height="25" decoding="async">
            </a>
        </div>
    </footer>
</body>
</html>
